<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1b">
  <title>NEXORA AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">NEXORA <span>AI</span></div>
    <div class="status">● هوش مصنوعی شما</div>
  </header>  <main class="container">
    <section class="hero">
      <div class="badge">✦ نسل جدید هوش مصنوعی</div>
      <h1>به <span>NEXORA AI</span> خوش آمدی</h1>
      <p>ابزار هوشمند مناسب کار، یادگیری و زندگی روزمره‌ات را پیدا کن.</p>
      <input id="search" type="search" placeholder="دنبال چه هوش مصنوعی می‌گردی؟">
    </section><section class="categories">
  <h2>دسته‌بندی ابزارها</h2>
  <div class="grid">
    <button class="card" data-category="chat">💬<b>چت و گفتگو</b><small>دستیارهای هوشمند</small></button>
    <button class="card" data-category="image">🎨<b>ساخت تصویر</b><small>طراحی و هنر دیجیتال</small></button>
    <button class="card" data-category="video">🎬<b>ساخت ویدیو</b><small>ویدیو و انیمیشن</small></button>
    <button class="card" data-category="study">📚<b>آموزش و درس</b><small>یادگیری هوشمند</small></button>
    <button class="card" data-category="code">💻<b>برنامه‌نویسی</b><small>کدنویسی و توسعه</small></button>
    <button class="card" data-category="home">🏠<b>لوازم خانگی هوشمند</b><small>خانه و زندگی</small></button>
    <button class="card" data-category="audio">🎵<b>موسیقی و صدا</b><small>صوت و آهنگ</small></button>
    <button class="card" data-category="work">📊<b>کار و کسب‌وکار</b><small>افزایش بهره‌وری</small></button>
  </div>
</section>

<section class="results">
  <h2 id="resultTitle">ابزارهای پیشنهادی</h2>
  <div id="tools" class="tool-list"></div>
</section>

  </main>  <footer> NEXORA AI · دنیای ابزارهای هوشمند </footer>
  <script src="app.js"></script>
</body>
</html>
